name: Android checks and releases

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Flowseal ships every ~8 days, hotfixes within hours; daily keeps the lag under a day.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      update_flowseal:
        description: 'Check latest stable Flowseal (verify only off main)'
        type: boolean
        default: false
      publish_release:
        description: 'Publish a signed GitHub release from main'
        type: boolean
        default: false
      play_protect_recipient:
        description: 'Base64 of a PEM certificate for a locally decryptable, signed test APK'
        type: string
        required: false
      flowseal_revision:
        description: 'Internal: exact promoted main SHA for an automatic release'
        type: string
        required: false
      flowseal_tag:
        description: 'Internal: upstream tag for an automatic release'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref != 'refs/heads/main' && github.ref || 'release' }}
  # Do not replace an already queued auto-release with an unrelated push or dispatch.
  queue: max
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  PYTHON_VERSION: '3.13'
  RELEASE_CERT_SHA256: 6b7e992f93bd0bfd8c9395ddf92d0e3684d236b0f29cdf637dfca80e20b60195

jobs:
  keepalive:
    # GitHub turns schedules off after 60 days without activity in a public
    # repository, and a quiet upstream would silently stop the core updates.
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/android-release.yml/enable"

  prepare:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPDATE_FLOWSEAL: ${{ github.event_name == 'schedule' || inputs.update_flowseal }}
    outputs:
      latest: ${{ steps.plan.outputs.latest }}
      revision: ${{ steps.snapshot.outputs.revision }}
      version_code: ${{ steps.release.outputs.version_code }}
      version_name: ${{ steps.release.outputs.version_name }}
      updates_enabled: ${{ steps.release.outputs.updates_enabled }}
      core_version: ${{ steps.upstream.outputs.core_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Plan a stable Flowseal update
        id: plan
        if: env.UPDATE_FLOWSEAL == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan=$(python scripts/sync_upstream.py --plan)
          jq -r '"Locked Flowseal: \(.locked)\nCandidate: \(if .candidate == "" then "none" else .candidate end)"' \
            <<< "$plan" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit candidate locally (no write token)
        id: snapshot
        if: steps.plan.outputs.candidate != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ steps.plan.outputs.candidate }}
        run: |
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          # Re-running the same candidate should produce the same commit.
          export GIT_AUTHOR_DATE="$(git show -s --format=%cI HEAD)"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          env -u GITHUB_OUTPUT python scripts/sync_upstream.py --ref "$CANDIDATE_TAG"
          test "$(jq -er .tag upstream/flowseal.lock.json)" = "$CANDIDATE_TAG"
          git add -f -A -- upstream/flowseal upstream/flowseal.lock.json
          git -c core.hooksPath=/dev/null commit -m "build: pin Flowseal $CANDIDATE_TAG"
          git bundle create "$RUNNER_TEMP/flowseal.bundle" HEAD "^$GITHUB_SHA"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.snapshot.outputs.revision != ''
        with:
          name: flowseal-candidate
          path: ${{ runner.temp }}/flowseal.bundle
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Guard the automatic release hand-off
        if: inputs.flowseal_revision != '' || inputs.flowseal_tag != ''
        env:
          EXPECTED_REVISION: ${{ inputs.flowseal_revision }}
          EXPECTED_TAG: ${{ inputs.flowseal_tag }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$EXPECTED_REVISION" = "$GITHUB_SHA"
          test "$(jq -er .tag upstream/flowseal.lock.json)" = "$EXPECTED_TAG"
      - name: Verify the committed upstream source
        id: upstream
        if: env.UPDATE_FLOWSEAL != 'true' || steps.snapshot.outputs.revision != ''
        run: |
          python scripts/sync_upstream.py --check
          python scripts/sync_byebyedpi.py --check
      - name: Resolve release metadata
        id: release
        if: steps.upstream.outputs.core_version != ''
        env:
          PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # VERSION holds MAJOR.MINOR; the next free patch on that line names the build.
          line="$(tr -d '[:space:]' < VERSION)"
          tags="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$line." --jq '.[].ref | sub("refs/tags/"; "")')"
          name="$(printf '%s\n' "$tags" | python scripts/release_version.py version --line "$line")"
          # The updater compares versionCode, so it is derived from the name:
          # major*10000 + minor*100 + patch keeps every build above the published ones.
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "version_code=$(python scripts/release_version.py code "$name")" >> "$GITHUB_OUTPUT"
          if [[ "$PRIVATE" == "true" ]]; then
            echo 'updates_enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'updates_enabled=true' >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: prepare
    if: needs.prepare.outputs.version_name != ''
    outputs:
      apk_sha256: ${{ steps.package.outputs.apk_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      APP_VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
      APP_UPDATES_ENABLED: ${{ needs.prepare.outputs.updates_enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Reuse trusted dependencies; never save caches from candidate builds.
          cache-read-only: ${{ needs.prepare.outputs.revision != '' || github.ref_name != github.event.repository.default_branch }}
      - uses: ./.github/actions/import-flowseal-candidate
        if: needs.prepare.outputs.revision != ''
        with:
          revision: ${{ needs.prepare.outputs.revision }}
          checkout: 'true'
      - name: Python runtime and integrity checks
        run: |
          python -m pip install -r scripts/requirements-test.txt
          python scripts/run_python_tests.py
      - name: Install Android SDK platform and tools
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: JVM tests, emulator APK, and unsigned ARM64 release
        id: package
        run: |
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \
            :dpi-runtime:testDebugUnitTest :app:testArm64DebugUnitTest \
            :app:assembleEmulatorDebug :app:assembleArm64Release \
            -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" \
            -PappUpdatesEnabled="$APP_UPDATES_ENABLED" --stacktrace
          mkdir -p unsigned
          cp app/build/outputs/apk/arm64/release/*-unsigned.apk unsigned/app-arm64-unsigned.apk
          python scripts/check_apk.py unsigned/app-arm64-unsigned.apk
          python scripts/check_apk.py app/build/outputs/apk/emulator/debug/*-debug.apk --abi x86_64
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            python scripts/check_permissions.py unsigned/app-arm64-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 unsigned/app-arm64-unsigned.apk
          echo "apk_sha256=$(sha256sum unsigned/app-arm64-unsigned.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Pass only verified APK to signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-unsigned-apk
          path: unsigned/app-arm64-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  pr-arm64-apk:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-unsigned-apk
          path: unsigned
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Sign and verify ARM64 test APK
        env:
          APK_SHA256: ${{ needs.verify.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          printf '%s  unsigned/app-arm64-unsigned.apk\n' "$APK_SHA256" | sha256sum --check
          sdkmanager 'build-tools;36.0.0'
          test_key="$RUNNER_TEMP/tgws-pr-test.p12"
          keytool -genkeypair -noprompt -keystore "$test_key" -storepass android \
            -alias tgws-pr-test -dname 'CN=TGWS Pull Request Test' -keyalg RSA -keysize 2048 -validity 365
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk="tgwsproxy-pr-test-arm64.apk"
          "$apksigner" sign --ks "$test_key" --ks-pass pass:android --ks-key-alias tgws-pr-test \
            --out "$apk" unsigned/app-arm64-unsigned.apk
          "$apksigner" verify --min-sdk-version 24 --verbose --print-certs -Werr "$apk"
      - name: Upload installable ARM64 test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-test-apk-arm64
          path: tgwsproxy-pr-test-arm64.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            target: default
            pages: 4096
            ram: 2048M
          - api: 25
            target: google_apis
            pages: 4096
            ram: 2048M
          - api: 26
            target: google_apis
            pages: 4096
            ram: 2048M
          - api: 35
            target: google_apis_ps16k
            pages: 16384
            ram: 4096M
    env:
      APP_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      APP_VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
      APP_UPDATES_ENABLED: ${{ needs.prepare.outputs.updates_enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ needs.prepare.outputs.revision != '' || github.ref_name != github.event.repository.default_branch }}
      - uses: ./.github/actions/import-flowseal-candidate
        if: needs.prepare.outputs.revision != ''
        with:
          revision: ${{ needs.prepare.outputs.revision }}
          checkout: 'true'
      - name: Build test packages before starting the emulator
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          test_key="$RUNNER_TEMP/tgws-debug.jks"
          keytool -genkeypair -noprompt -keystore "$test_key" -storepass android -keypass android -alias androiddebugkey -dname 'CN=TGWS Android Tests' -keyalg RSA -keysize 2048 -validity 2 -storetype JKS
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:assembleEmulatorRelease :app:assembleEmulatorDebug :app:assembleEmulatorDebugAndroidTest -PtestKeystore="$test_key" -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" -PappUpdatesEnabled="$APP_UPDATES_ENABLED" --stacktrace
          # Test the actual minified/shrunk release with an ephemeral test key.
          # Production signing secrets are unavailable in this job.
          mkdir -p build
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$test_key" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out build/tgws-emulator-release.apk app/build/outputs/apk/emulator/release/app-emulator-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify build/tgws-emulator-release.apk
          python scripts/check_apk.py build/tgws-emulator-release.apk --abi x86_64
          python scripts/create_update_test_fixtures.py --sdk "$ANDROID_HOME" --output build/tgws-updater-fixtures --keystore "$test_key" --storepass android --alias androiddebugkey --version-code "$APP_VERSION_CODE"
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --stop
      - name: Free SDK space for the test device
        run: |
          # Python and its extensions are prebuilt; this app does not use NDK/CMake.
          sudo rm -rf -- /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          df -h "$ANDROID_HOME"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android runtime and lifecycle tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7
          disk-size: 2048M
          ram-size: ${{ matrix.ram }}
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu software -noaudio -no-boot-anim -camera-back none -no-metrics
          # Both variants use the same temporary signing key. Keep the release
          # so the instrumentation suite also exercises installation over it.
          script: |
            python scripts/smoke_release.py --apk build/tgws-emulator-release.apk --keep-installed --report app/build/outputs/androidTest-results/release-smoke-api-${{ matrix.api }}.txt
            python scripts/run_android_tests.py --apk app/build/outputs/apk/emulator/debug/app-emulator-debug.apk --test-apk app/build/outputs/apk/androidTest/emulator/debug/app-emulator-debug-androidTest.apk --wrong-signer-apk build/tgws-updater-fixtures/wrong-key.apk --expected-page-size ${{ matrix.pages }} --report app/build/outputs/androidTest-results/api-${{ matrix.api }}.txt
      - name: Keep verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports-api${{ matrix.api }}
          path: |
            app/build/reports
            app/build/outputs/androidTest-results
          retention-days: 14

  play-protect-preview:
    needs: [prepare, verify, android]
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && !inputs.update_flowseal && !inputs.publish_release && inputs.play_protect_recipient != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-unsigned-apk
          path: unsigned
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Verify the tested APK and recipient certificate
        env:
          APK_SHA256: ${{ needs.verify.outputs.apk_sha256 }}
          RECIPIENT_CERTIFICATE: ${{ inputs.play_protect_recipient }}
        run: |
          set -euo pipefail
          printf '%s  unsigned/app-arm64-unsigned.apk\n' "$APK_SHA256" | sha256sum --check
          printf '%s' "$RECIPIENT_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/preview-recipient.pem"
          openssl x509 -in "$RUNNER_TEMP/preview-recipient.pem" -noout -checkend 600
          sdkmanager 'build-tools;36.0.0'
      - name: Sign and encrypt the test APK
        env:
          TGWS_KEYSTORE_BASE64: ${{ secrets.TGWS_KEYSTORE_BASE64 }}
          TGWS_KEYSTORE_PASSWORD: ${{ secrets.TGWS_KEYSTORE_PASSWORD }}
          TGWS_KEY_ALIAS: ${{ secrets.TGWS_KEY_ALIAS }}
          TGWS_KEY_PASSWORD: ${{ secrets.TGWS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          preview_dir="$(mktemp -d "$RUNNER_TEMP/tgws-preview.XXXXXX")"
          trap 'rm -rf -- "$preview_dir"' EXIT
          printf '%s' "$TGWS_KEYSTORE_BASE64" | base64 --decode > "$preview_dir/keystore.jks"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" sign --ks "$preview_dir/keystore.jks" \
            --ks-pass env:TGWS_KEYSTORE_PASSWORD --ks-key-alias "$TGWS_KEY_ALIAS" \
            --key-pass env:TGWS_KEY_PASSWORD --out "$preview_dir/preview.apk" unsigned/app-arm64-unsigned.apk
          "$apksigner" verify --verbose --print-certs -Werr "$preview_dir/preview.apk" | tee "$preview_dir/signature.txt"
          test "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$preview_dir/signature.txt")" = "$RELEASE_CERT_SHA256"
          grep -Fx 'Number of signers: 1' "$preview_dir/signature.txt"
          sha256sum "$preview_dir/preview.apk" | cut -d ' ' -f 1
          mkdir -p preview
          openssl cms -encrypt -binary -aes-256-gcm -outform DER \
            -in "$preview_dir/preview.apk" -out preview/play-protect-preview.der \
            -recip "$RUNNER_TEMP/preview-recipient.pem" \
            -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256 -keyopt rsa_mgf1_md:sha256
      - name: Upload encrypted preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: play-protect-preview-encrypted
          path: preview/play-protect-preview.der
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    needs: [prepare, verify, android]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.update_flowseal && inputs.publish_release && inputs.play_protect_recipient == ''
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      APP_VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
      CORE_VERSION: ${{ needs.prepare.outputs.core_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-unsigned-apk
          path: unsigned
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Verify the revision and the tested APK before signing
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ needs.verify.outputs.apk_sha256 }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          printf '%s  unsigned/app-arm64-unsigned.apk\n' "$APK_SHA256" | sha256sum --check
          python scripts/sync_upstream.py --check
          sdkmanager 'build-tools;36.0.0'
      - name: Sign verified APK without executing upstream code
        env:
          TGWS_KEYSTORE_BASE64: ${{ secrets.TGWS_KEYSTORE_BASE64 }}
          TGWS_KEYSTORE_PASSWORD: ${{ secrets.TGWS_KEYSTORE_PASSWORD }}
          TGWS_KEY_ALIAS: ${{ secrets.TGWS_KEY_ALIAS }}
          TGWS_KEY_PASSWORD: ${{ secrets.TGWS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TGWS_KEYSTORE_BASE64"
          key="$RUNNER_TEMP/tgws-release.jks"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$TGWS_KEYSTORE_BASE64" | base64 --decode > "$key"
          mkdir -p release
          apk="release/tgwsproxy-$APP_VERSION_NAME-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$key" \
            --ks-pass env:TGWS_KEYSTORE_PASSWORD --ks-key-alias "$TGWS_KEY_ALIAS" \
            --key-pass env:TGWS_KEY_PASSWORD --out "$apk" unsigned/app-arm64-unsigned.apk
      - name: Verify release signature and create metadata
        run: |
          set -euo pipefail
          apk="release/tgwsproxy-$APP_VERSION_NAME-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs -Werr "$apk" | tee "$RUNNER_TEMP/apk-certs.txt"
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certs.txt")"
          test "$signer" = "$RELEASE_CERT_SHA256"
          grep -Fx 'Number of signers: 1' "$RUNNER_TEMP/apk-certs.txt"
          python scripts/release_metadata.py "$apk" --version-code "$APP_VERSION_CODE" --version-name "$APP_VERSION_NAME"
      - name: Attest the signed APK against the source revision
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*.apk
      - name: Publish signed release in the repository's current visibility
        env:
          GH_TOKEN: ${{ github.token }}
          FLOWSEAL_REVISION: ${{ inputs.flowseal_revision }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if [[ -n "$FLOWSEAL_REVISION" ]]; then
            existing_release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .target_commitish')
            if grep -Fxq "$FLOWSEAL_REVISION" <<< "$existing_release"; then
              echo 'A release for this Flowseal revision already exists.'
              exit 0
            fi
          fi
          tag="v$APP_VERSION_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace an installed version."
            exit 1
          fi
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')"
          if grep -Fxq "refs/tags/$tag" <<< "$existing"; then
            echo "Tag $tag appeared during this run. Start a new run."
            exit 1
          fi
          python scripts/release_version.py notes --version "$APP_VERSION_NAME" \
            --version-code "$APP_VERSION_CODE" --core-version "$CORE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" release/*.apk release/update.json release/SHA256SUMS \
            --target "$(git rev-parse HEAD)" --title "ByeBye TGWS Proxy Android $APP_VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  promote-flowseal:
    needs: [prepare, verify, android]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.revision != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/import-flowseal-candidate
        with:
          revision: ${{ needs.prepare.outputs.revision }}
      - name: Fast-forward main and explicitly dispatch the committed-source release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          FLOWSEAL_TAG: ${{ needs.prepare.outputs.latest }}
        run: |
          live=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$live" != "$REVISION" ]]; then
            test "$live" = "$GITHUB_SHA" || { echo 'main changed during verification; retry on current main.'; exit 1; }
            # Check provenance again after testing. Never check out candidate files in this job.
            lock=$(git show "$REVISION:upstream/flowseal.lock.json")
            test "$(jq -er .tag <<< "$lock")" = "$FLOWSEAL_TAG"
            test "$(gh api "repos/Flowseal/tg-ws-proxy/commits/$FLOWSEAL_TAG" --jq .sha)" = "$(jq -er .commit <<< "$lock")"
            gh auth setup-git
            git -c core.hooksPath=/dev/null push origin "$REVISION:refs/heads/main"
          fi
          # GITHUB_TOKEN pushes do not trigger push workflows. A new dispatch gives
          # attestation the exact committed main SHA, not the pre-update revision.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$REVISION" || {
            echo 'main changed before the release could be dispatched.'
            exit 1
          }
          gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f publish_release=true -f flowseal_revision="$REVISION" -f flowseal_tag="$FLOWSEAL_TAG"

  report-flowseal-failure:
    needs: [prepare, verify, android, promote-flowseal, release]
    if: >-
      ${{ failure() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.update_flowseal || inputs.flowseal_revision != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: File one issue per upstream version
        env:
          GH_TOKEN: ${{ github.token }}
          FLOWSEAL_TAG: ${{ needs.prepare.outputs.latest || inputs.flowseal_tag }}
        run: |
          tag=${FLOWSEAL_TAG:-unknown}
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then tag=unknown; fi
          title="Flowseal $tag: automatic update failed"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null) | .title')
          if grep -Fxq "$title" <<< "$existing"; then exit 0; fi
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- \(.name): \([.steps[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | join(", ")) — \(.html_url)"')
          {
            printf 'Upstream: `%s`\n\nRun: %s/%s/actions/runs/%s/attempts/%s\n\n' \
              "$tag" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Failed checks or steps:\n%s\n\n' "${jobs:-See the run for details.}"
            printf 'A failed verification does not promote the candidate. A failed release does not replace the previously published APK.\n'
          } > "$RUNNER_TEMP/flowseal-issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/flowseal-issue.md"
