name: Replace legacy personal name

on:
  push:
    paths:
      - .github/workflows/identity-audit.yml

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Redact current tracked files and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          first = 'Дмитрий'
          last = 'Горлов'
          first_gen = 'Дмитрия'
          last_gen = 'Горлова'
          en_first = 'Dmitriy'
          en_last = 'Gorlov'
          ru = first + ' ' + last
          gen = first_gen + ' ' + last_gen
          en = en_first + ' ' + en_last
          ru_up = ru.upper()
          en_up = en.upper()
          pairs = [
              (ru + ' (' + en + ')', 'Derigava'),
              (ru + ' / ' + en, 'Derigava'),
              (ru_up + ' / ' + en_up, 'DERIGAVA'),
              (gen, 'Derigava'),
              (ru_up, 'DERIGAVA'),
              (ru, 'Derigava'),
              (en_up, 'DERIGAVA'),
              (en, 'Derigava'),
              ('Dmitry' + ' ' + en_last, 'Derigava'),
              ('Dmitrii' + ' ' + en_last, 'Derigava'),
          ]
          paths = [Path(p.decode()) for p in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0') if p]
          modified = []
          unreadable = []
          for p in paths:
              if not p.is_file() or p.is_symlink():
                  continue
              raw = p.read_bytes()
              if b'\0' in raw:
                  if any(old.encode() in raw for old, _ in pairs):
                      unreadable.append(str(p))
                  continue
              try:
                  old_text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  if any(old.encode() in raw for old, _ in pairs):
                      unreadable.append(str(p))
                  continue
              new_text = old_text
              for old, new in pairs:
                  new_text = new_text.replace(old, new)
              if new_text != old_text:
                  p.write_bytes(new_text.encode('utf-8'))
                  modified.append(str(p))
          print('Checked', len(paths), 'tracked paths.')
          print('Changed files:', *modified, sep='\n  ')
          if unreadable:
              print('Binary files requiring manual check:', *unreadable, sep='\n  ')
              raise SystemExit(1)
          for p in paths:
              if p.is_file() and not p.is_symlink():
                  try: text = p.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError): continue
                  if any(old in text for old, _ in pairs):
                      raise SystemExit('Personal name remains in ' + str(p))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Use Derigava pseudonym in repository files"
            git push
          fi
